# NB. this file configures dependabot's approach to general version updates of dependencies
# fixes for vulnerabilities/CVEs (i.e. security updates) are handled automatically as per repo settings
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["pnpm"]
    open-pull-requests-limit: 10
    groups:
      tiptap:
        patterns: ["@tiptap/*"]
      pulumi:
        patterns: ["@pulumi/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      sharedb:
        patterns: ["sharedb", "@types/sharedb"]
    ignore:
      # Node version is managed manually, only allow patches
      - dependency-name: "@types/node"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
    # Matches pnpm's `minimumReleaseAge` in pnpm-workspace.yaml
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3

  - package-ecosystem: "docker"
    directory: "/apps/hasura.planx.uk"
    schedule:
      interval: "monthly"
    labels: ["hasura", "docker"]
    open-pull-requests-limit: 1

  - package-ecosystem: "docker"
    directory: "/apps/hasura.planx.uk/proxy"
    schedule:
      interval: "monthly"
    labels: ["hasura", "caddy", "docker"]
    open-pull-requests-limit: 1

  - package-ecosystem: "docker"
    directory: "/apps/sharedb.planx.uk"
    schedule:
      interval: "monthly"
    labels: ["sharedb", "docker"]
    open-pull-requests-limit: 1

  - package-ecosystem: "docker"
    directory: "/apps/api.planx.uk"
    schedule:
      interval: "monthly"
    labels: ["api", "docker"]
    open-pull-requests-limit: 1

  # Caddy container (reverse proxy for pizzas)
  - package-ecosystem: "docker"
    directory: "/ci/caddy"
    schedule:
      interval: "monthly"
    labels: ["ci", "caddy", "docker"]
    open-pull-requests-limit: 1

  # custom postgres container
  - package-ecosystem: "docker"
    directory: "/apps/postgres"
    schedule:
      interval: "monthly"
    labels: ["ci", "postgres", "docker"]
    open-pull-requests-limit: 1

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["ci", "github-actions"]
