# NB. this file configures dependabot's approach to general version updates of dependencies
# fixes for vulnerabilities/CVEs (i.e. security updates) are handled automatically as per repo settings
#
# Every entry carries a "[skip pizza]" commit-message prefix - we rarely need these environments for 
# a package update. CI linting, testing, and building (via E2E) should be sufficient here

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["pnpm"]
    commit-message:
      prefix: "[skip pizza] "
    open-pull-requests-limit: 10
    groups:
      tiptap:
        patterns: ["@tiptap/*"]
      pulumi:
        patterns: ["@pulumi/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      sharedb:
        patterns: ["sharedb", "@types/sharedb"]
    ignore:
      # Majors only across the workspace so we don't fall too far behind
      # Security updates bypass this and still raise PRs for CVEs
      - dependency-name: "*"
        update-types:
          ["version-update:semver-patch", "version-update:semver-minor"]
      # Node version is managed manually - also ignore major versions
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # Matches pnpm's `minimumReleaseAge` in pnpm-workspace.yaml
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3

  - package-ecosystem: "docker"
    directory: "/apps/hasura.planx.uk"
    schedule:
      interval: "monthly"
    labels: ["hasura", "docker"]
    commit-message:
      prefix: "[skip pizza] "
    open-pull-requests-limit: 1

  - package-ecosystem: "docker"
    directory: "/apps/hasura.planx.uk/proxy"
    schedule:
      interval: "monthly"
    labels: ["hasura", "caddy", "docker"]
    commit-message:
      prefix: "[skip pizza] "
    open-pull-requests-limit: 1

  - package-ecosystem: "docker"
    directory: "/apps/sharedb.planx.uk"
    schedule:
      interval: "monthly"
    labels: ["sharedb", "docker"]
    commit-message:
      prefix: "[skip pizza] "
    open-pull-requests-limit: 1

  - package-ecosystem: "docker"
    directory: "/apps/api.planx.uk"
    schedule:
      interval: "monthly"
    labels: ["api", "docker"]
    commit-message:
      prefix: "[skip pizza] "
    open-pull-requests-limit: 1

  # Caddy container (reverse proxy for pizzas)
  - package-ecosystem: "docker"
    directory: "/ci/caddy"
    schedule:
      interval: "monthly"
    labels: ["ci", "caddy", "docker"]
    commit-message:
      prefix: "[skip pizza] "
    open-pull-requests-limit: 1

  # custom postgres container
  - package-ecosystem: "docker"
    directory: "/apps/postgres"
    schedule:
      interval: "monthly"
    labels: ["ci", "postgres", "docker"]
    commit-message:
      prefix: "[skip pizza] "
    open-pull-requests-limit: 1

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["ci", "github-actions"]
    commit-message:
      prefix: "[skip pizza] "
