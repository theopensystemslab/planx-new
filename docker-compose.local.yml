services:
  postgres:
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      target: development
    restart: always
    volumes:
      - "./apps/api.planx.uk:/api"
      - "/api/node_modules"
      # Mount of all workspace packages, for watching rather than resolution: tsx hard-ignores
      # `**/node_modules/**` so the mount(s) below can never trigger a reload on their own.
      - "./packages:/packages:ro"
      # `pnpm deploy --inject-workspace-packages` bakes a *copy* of compiled `.packages/*` dist/'s into the image.
      # To avoid stale copies we shadow it with the host package, which is kept fresh by scripts/build-packages.sh.
      - "./packages/file-upload:/api/node_modules/@planx/file-upload:ro"

    environment:
      NODE_ENV: "development"
      # The S3 mock has no Scanii equivalent - pinned here rather than left to .env
      ENFORCE_SCAN_FROM: ""

  sharedb:
    volumes:
      - "./apps/sharedb.planx.uk:/sharedb"
      - "/sharedb/node_modules"

volumes:
  postgres_data:
