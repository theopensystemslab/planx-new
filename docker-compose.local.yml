services:
  postgres:
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      target: development
    restart: always
    volumes:
      - "./apps/api.planx.uk:/api"
      - "/api/node_modules"

    environment:
      NODE_ENV: "development"
      # Minio has no Scanii equivalent - pinned here rather than left to .env
      ENFORCE_SCAN_FROM: ""

  sharedb:
    volumes:
      - "./apps/sharedb.planx.uk:/sharedb"
      - "/sharedb/node_modules"

volumes:
  postgres_data:
