packages:
  - apps/*
  - apps/hasura.planx.uk/tests
  - packages/*
  - e2e
  - e2e/tests/ui-driven
  - e2e/tests/api-driven
  - infrastructure/*
  - scripts/*

catalog:
  '@opensystemslab/map': 1.0.0-alpha.17
  '@opensystemslab/planx-core': github:theopensystemslab/planx-core#436fb79a41dfde0d10af82c7baee93b00ae9cbc7
  '@types/jsdom': ^30.0.0
  '@types/node': ~24.10.15
  axios: ^1.20.0
  csv-stringify: ^6.8.3
  date-fns: ^4.4.0
  dompurify: ^3.4.16
  dotenv: ^18.0.1
  eslint: ^9.39.5
  globals: ^16.5.0
  # Pinned to 30.0.x: jsdom 30.1 breaks Blob/FormData in Vitest 4 (vitest-dev/vitest#11336), fixed in Vitest 5.0.3
  jsdom: ~30.0.1
  nanoid: ^6.0.1
  prettier: ^3.9.6
  stripe: ^22.1.1
  uuid: ^14.0.2
  vite: ^6.4.3
  vitest: ^4.1.11

catalogs:
  graphql:
    graphql: ^16.14.2
    graphql-request: 4.3.0
    graphql-tag: ^2.12.7
  infrastructure:
    '@pulumi/aws': ^7.43.0
    '@pulumi/awsx': ^3.9.0
    '@pulumi/cloudflare': ^6.20.0
    '@pulumi/postgresql': ^3.18.0
    '@pulumi/pulumi': ^3.259.0
  jwt:
    '@types/jsonwebtoken': ^9.0.10
    jsonwebtoken: ^9.0.3
  lodash:
    '@types/lodash': ^4.17.25
    lodash: ^4.18.1
  sharedb:
    '@types/sharedb': ^6.0.1
    sharedb: ^6.0.2
  typescript:
    typescript: ~5.9.3

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - '@opensystemslab/map@1.0.0-alpha.17'
  # Storybook bump needed to fix issues with new Tanstack Router dependency
  - 'storybook@10.6.1'
  - '@storybook/addon-a11y@10.6.1'
  - '@storybook/addon-docs@10.6.1'
  - '@storybook/addon-links@10.6.1'
  - '@storybook/tanstack-react@10.6.1'
  - '@storybook/react-dom-shim@10.6.1'
  - '@storybook/react-vite@10.6.1'
  - '@storybook/builder-vite@10.6.1'
  - '@storybook/react@10.6.1'
