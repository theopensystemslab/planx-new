openapi: 3.1.0
info:
  title: Plan✕ API
  version: 0.1.0
tags:
  - name: file
    description: Endpoints for uploading, downloading and deleting files
components:
  parameters:
    fileKey:
      in: path
      name: fileKey
      type: string
      required: true
    fileName:
      in: path
      name: fileName
      type: string
      required: true
  schemas:
    UploadFile:
      type: object
      properties:
        filename:
          type: string
          required: true
        file:
          type: string
          format: binary
  responses:
    UploadFile:
      type: object
      properties:
        fileType:
          oneOf:
            - type: string
            - type: "null"
        fileUrl:
          type: string
    UnsupportedFileType:
      description: The uploaded file has an unsupported extension
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Unsupported file type. Extension: .txt"
    MismatchedFileContent:
      description: The content of the uploaded file does not appear to match the file type
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "File content does not match given extension: .txt"
    FileTooLarge:
      description: The uploaded file exceeds the 30MB size limit
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "File too large"
    DownloadFile:
      description: Successful response
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    MissingFile:
      description: |
        The file cannot be served. `FILE_NOT_FOUND` means no such object exists (or, on the
        public route, it exists but is private). `FILE_FLAGGED` means Scanii reported findings.
      content:
        application/json:
          schema:
            type: "object"
            properties:
              error:
                type: "string"
                enum: ["FILE_NOT_FOUND", "FILE_FLAGGED"]
                example: "FILE_NOT_FOUND"
    FileScanPending:
      description: |
        Our content moderation system (Scanii) has not finished scanning this file, so we won't serve it yet.
        This is transient - retry after the number of seconds given in the `Retry-After` header.
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
            example: 30
      content:
        application/json:
          schema:
            type: "object"
            properties:
              error:
                type: "string"
                example: "FILE_SCAN_PENDING"
paths:
  /file/private/upload:
    post:
      tags: ["file"]
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadFile"
      responses:
        "200":
          $ref: "#/components/responses/UploadFile"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedFileType"
        "500":
          $ref: "#/components/responses/ErrorMessage"
  /file/public/upload:
    post:
      tags: ["file"]
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadFile"
      responses:
        "200":
          $ref: "#/components/responses/UploadFile"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedFileType"
        "500":
          $ref: "#/components/responses/ErrorMessage"
  /file/public/{fileKey}/{fileName}:
    get:
      tags: ["file"]
      parameters:
        - $ref: "#/components/parameters/fileKey"
        - $ref: "#/components/parameters/fileName"
      responses:
        "200":
          $ref: "#/components/responses/DownloadFile"
        "404":
          $ref: "#/components/responses/MissingFile"
        "500":
          $ref: "#/components/responses/ErrorMessage"
        "503":
          $ref: "#/components/responses/FileScanPending"
    delete:
      tags: ["file"]
      parameters:
        - $ref: "#/components/parameters/fileKey"
        - $ref: "#/components/parameters/fileName"
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Successful deletion
        "404":
          $ref: "#/components/responses/MissingFile"
        "500":
          $ref: "#/components/responses/ErrorMessage"
  /file/private/{fileKey}/{fileName}:
    get:
      tags: ["file"]
      parameters:
        - $ref: "#/components/parameters/fileKey"
        - $ref: "#/components/parameters/fileName"
      security:
        - fileAPIKeyAuth: []
      responses:
        "200":
          $ref: "#/components/responses/DownloadFile"
        "404":
          $ref: "#/components/responses/MissingFile"
        "500":
          $ref: "#/components/responses/ErrorMessage"
        "503":
          $ref: "#/components/responses/FileScanPending"
