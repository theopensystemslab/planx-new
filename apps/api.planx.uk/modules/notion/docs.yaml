openapi: 3.1.0
info:
  title: Plan✕ API
  version: 0.1.0
tags:
  - name: notion
    description: Notion content used for editor guidance
paths:
  /notion/page/{pageId}:
    get:
      summary: Get a public Notion page
      description: Returns the record map for a publicly shared Notion page, for rendering with react-notion-x
      tags:
        - notion
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: pageId
          required: true
          schema:
            type: string
          description: Notion page ID (32 hex characters, optionally hyphenated)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Invalid page ID
        "500":
          description: Failed to fetch page from Notion
