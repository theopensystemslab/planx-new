openapi: 3.1.0
info:
  title: Plan✕ API
  version: 0.1.0
tags:
  - name: stripe
    description: Endpoints for interacting with the Stripe API
    externalDocs:
      url: https://docs.stripe.com/
components:
  parameters:
    localAuthority:
      in: path
      name: localAuthority
      required: true
      schema:
        type: string
    teamSlug:
      in: path
      name: teamSlug
      required: true
      schema:
        type: string
      example: lambeth
  schemas:
    CreateCheckoutSessionRequest:
      description: |
        Details required to create a Stripe hosted Checkout Session.

        Docs: [https://docs.stripe.com/api/checkout/sessions/create](https://docs.stripe.com/api/checkout/sessions/create)
      content:
        application/json:
          schema:
            type: object
            required:
              - sessionId
              - flowId
              - amount
              - returnURL
              - metadata
            properties:
              sessionId:
                type: string
                format: uuid
              flowId:
                type: string
                format: uuid
              amount:
                type: integer
                format: int32
                description: Amount to charge, in pence
                example: 14500
              returnURL:
                type: string
                format: uri
                example: "https://editor.planx.uk/team/flow/published"
              metadata:
                type: object
                required:
                  - flow
                  - source
                  - paidViaInviteToPay
                properties:
                  flow:
                    type: string
                    example: "Apply for planning permission"
                  source:
                    type: string
                    enum:
                      - "PlanX"
                    description: Fixed PlanX default
                  paidViaInviteToPay:
                    type: string
                    example: "false"
                additionalProperties:
                  type: string
  responses:
    CreateCheckoutSessionResponse:
      content:
        application/json:
          description: |
            The hosted Checkout Session URL to redirect the applicant to.
          schema:
            type: object
            properties:
              url:
                type: string
                format: uri
                nullable: true
                example: "https://checkout.stripe.com/c/pay/cs_test_a1b2c3"
    CheckoutSessionStatusResponse:
      content:
        application/json:
          description: |
            The Checkout Session's status, for the applicant's return page.
          schema:
            type: object
            properties:
              status:
                type: string
                nullable: true
                enum: [complete, expired, open]
                example: complete
              paymentStatus:
                type: string
                enum: [paid, unpaid, no_payment_required]
                example: paid
              paymentIntentId:
                type: string
                nullable: true
                description: PaymentIntent id (the payment reference); null until paid
                example: pi_test_a1b2c3
    ConnectStatusResponse:
      description: The team's Stripe Connect status, for the editor's payments settings page.
      content:
        application/json:
          schema:
            type: object
            required:
              - connected
              - accountId
              - mode
            properties:
              connected:
                type: boolean
                description: Whether the team has a connected Stripe account
                example: true
              accountId:
                type: string
                nullable: true
                description: The team's connected Stripe account id; null if not connected
                example: acct_1a2b3c
              mode:
                type: string
                enum: [test, live]
                description: The Stripe mode this environment runs in
                example: live
paths:
  /stripe/connect/{teamSlug}/status:
    get:
      summary: Get a team's Stripe Connect status
      description: |
        Returns whether the team has connected a Stripe account, and the Stripe mode for
        this environment.
      tags:
        - stripe
      parameters:
        - $ref: "#/components/parameters/teamSlug"
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/ConnectStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "403":
          description: The user is not a teamEditor/teamAdmin of this team, or a platformAdmin.
        "404":
          description: Team not found.
        "500":
          description: Failed to fetch the Stripe Connect status.
  /stripe/connect/{teamSlug}:
    get:
      summary: Start Stripe Connect onboarding for a team
      description: |
        **Staging (test mode):** creates a Stripe account for the team prefilled with
        Stripe's test data (or resumes the team's unfinished account from the session),
        and redirects to Stripe-hosted onboarding (an account link). The user signs in or
        signs up to Stripe to take ownership of the account, then Stripe redirects back to
        `/stripe/connect/{teamSlug}/return`. This route is also the account link's refresh URL,
        so expired links restart onboarding for the same account.

        **Production (live mode):** redirects to Stripe's OAuth screen to connect the
        council's own Stripe account. On completion, Stripe redirects back to
        `/stripe/connect/callback`.
      tags:
        - stripe
      parameters:
        - $ref: "#/components/parameters/teamSlug"
      security:
        - bearerAuth: []
      responses:
        "302":
          description: >-
            Redirect to Stripe-hosted onboarding (staging) or Stripe's OAuth screen (production).
        "401":
          $ref: "#/components/responses/Unauthorised"
        "403":
          description: The user is not a teamEditor/teamAdmin of this team, or a platformAdmin.
        "404":
          description: Team not found.
        "500":
          description: >-
            Failed to start Stripe Connect onboarding (including failing to create the
            staging account or its onboarding link).
  /stripe/connect/{teamSlug}/return:
    get:
      summary: Handle the return from staging Stripe onboarding
      description: |
        Staging (test mode) only. Stripe redirects here when the user finishes or leaves
        Stripe-hosted onboarding. If onboarding is complete, the team's pending account
        (from the session) is saved as its staging Stripe account. Otherwise it is kept
        pending, so connecting again resumes it.
      tags:
        - stripe
      parameters:
        - $ref: "#/components/parameters/teamSlug"
      security:
        - bearerAuth: []
      responses:
        "302":
          description: |
            Redirect to the editor's payments settings page with either
            `?stripeConnected=true`, or `?stripeError=<reason>` where reason is one of:
            - `invalid_state` - no pending onboarding account for this team in the session
            - `onboarding_incomplete` - the user left onboarding before finishing it
            - `connect_failed` - checking the account or saving the account id failed
        "401":
          $ref: "#/components/responses/Unauthorised"
        "403":
          description: The user is not a teamEditor/teamAdmin of this team, or a platformAdmin.
        "404":
          description: Team not found.
  /stripe/connect/callback:
    get:
      summary: Handle Stripe Connect OAuth callback
      description: |
        Production (live mode) only - staging returns to `/stripe/connect/{teamSlug}/return`.
        Stripe redirects here after the user completes (or declines) the OAuth process.
        The requester is identified by the signed session state set when onboarding
        started, not a JWT. Saves the connected account id and redirects to the editor.
      tags:
        - stripe
      parameters:
        - in: query
          name: code
          schema:
            type: string
          description: OAuth authorisation code, exchanged for the connected account id
        - in: query
          name: state
          schema:
            type: string
          description: Nonce matching the one saved in the session when onboarding started
        - in: query
          name: error
          schema:
            type: string
          description: OAuth error from Stripe, e.g. `access_denied`
      responses:
        "302":
          description: |
            Redirect to the editor's payments settings page with either
            `?stripeConnected=true`, or `?stripeError=<reason>` where reason is one of:
            - `invalid_state` - missing or mismatched session state (redirects to `/app` instead)
            - `missing_code` - no authorisation code returned
            - `connect_failed` - exchanging the code or saving the account id failed
            - Stripe's OAuth `error` value, e.g. `access_denied`
  /stripe/checkout-session/{localAuthority}:
    post:
      summary: Create a Stripe Checkout Session
      description: |
        Create a bare Stripe hosted Checkout Session on the platform account and
        return its URL.

        Docs: [https://docs.stripe.com/api/checkout/sessions/create](https://docs.stripe.com/api/checkout/sessions/create)
      tags:
        - stripe
      parameters:
        - $ref: "#/components/parameters/localAuthority"
      requestBody:
        $ref: "#/components/schemas/CreateCheckoutSessionRequest"
      responses:
        "200":
          $ref: "#/components/responses/CreateCheckoutSessionResponse"
        "400":
          description: Invalid request body or parameters.
        "409":
          description: >-
            This LPA is not set up to take Stripe payments. 
            Either its payment provider is not Stripe, or it has not connected a Stripe account.
        "500":
          description: Failed to create the Stripe Checkout Session.
  /stripe/checkout-session/{localAuthority}/{checkoutSessionId}:
    get:
      summary: Retrieve a Stripe Checkout Session's status
      description: |
        Retrieve a Checkout Session's status from the Pay component on return.
        The webhook remains the source of truth for fulfilment.

        Docs: [https://docs.stripe.com/checkout/fulfillment](https://docs.stripe.com/checkout/fulfillment)
      tags:
        - stripe
      parameters:
        - $ref: "#/components/parameters/localAuthority"
        - in: path
          name: checkoutSessionId
          required: true
          schema:
            type: string
          example: cs_test_a1b2c3
      responses:
        "200":
          $ref: "#/components/responses/CheckoutSessionStatusResponse"
  /stripe/webhook:
    post:
      summary: Receive a Stripe webhook event
      description: |
        Endpoint which Stripe POSTs events to. Records the payment lifecycle
        (`payment_intent.*` events) to the `payment_status` table, and copies
        PaymentIntent metadata onto the connected account's destination payment
        (`transfer.created` events).

        Docs: [https://docs.stripe.com/webhooks](https://docs.stripe.com/webhooks)
      tags:
        - stripe
      requestBody:
        description: The raw Stripe event payload.
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Event received (verified and recorded, or ignored as an unhandled type).
        "400":
          description: Missing or invalid `stripe-signature` - verification failed.
        "500":
          description: >-
            Event verified, but handling it failed (recording the payment status, or
            updating the destination payment). Returned deliberately so Stripe
            redelivers the event and the write is retried.
