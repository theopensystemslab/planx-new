- name: analyze_sessions
  webhook: '{{HASURA_PLANX_API_URL}}/webhooks/hasura/analyze-sessions'
  schedule: 0 3 * * *
  include_in_metadata: true
  payload: {}
  headers:
    - name: authorization
      value_from_env: HASURA_PLANX_API_KEY
  comment: Parses allow-list answers for submitted sessions to retain for analytics post-sanitation
- name: log_failed_submissions
  webhook: '{{HASURA_PLANX_API_URL}}/webhooks/hasura/failed-submissions'
  schedule: 0 9,17 * * *
  include_in_metadata: true
  payload: {}
  headers:
    - name: authorization
      value_from_env: HASURA_PLANX_API_KEY
  comment: 'Checks for any failed submissions and logs them to #planx-notifications-internal to investigate further'
- name: reconcile_payments
  webhook: '{{HASURA_PLANX_API_URL}}/webhooks/hasura/reconcile-payments'
  schedule: 0 */3 * * *
  include_in_metadata: true
  payload: {}
  headers:
    - name: authorization
      value_from_env: HASURA_PLANX_API_KEY
  comment: 'Re-checks GOV.UK Pay for sessions which began a payment but were never submitted, and logs any paid-but-unsubmitted sessions to #planx-notifications-internal'
- name: sanitise_audit_records_data
  webhook: '{{HASURA_PLANX_API_URL}}/webhooks/hasura/sanitise-audit-records-data'
  schedule: 0 2 5 * *
  include_in_metadata: true
  payload: {}
  retry_conf:
    num_retries: 0
    retry_interval_seconds: 10
    timeout_seconds: 120
    tolerance_seconds: 21600
  comment: Sanitise audit records data on a nightly basis
- name: sanitise_feedback_data
