table:
  name: payment_status
  schema: public
object_relationships:
  - name: lowcal_session
    using:
      manual_configuration:
        column_mapping:
          session_id: id
        insertion_order: null
        remote_table:
          name: lowcal_sessions
          schema: public
  - name: payment_status_enum
    using:
      foreign_key_constraint_on: status
  - name: stripe_payment_status_enum
    using:
      foreign_key_constraint_on: stripe_status
insert_permissions:
  - role: api
    permission:
      check: {}
      columns:
        - fee_breakdown
        - gov_pay_metadata
        - stripe_metadata
        - stripe_payment_id
        - stripe_status
        - team_slug
        - created_at
        - flow_id
        - session_id
        - payment_id
        - status
        - amount
select_permissions:
  - role: api
    permission:
      columns:
        - fee_breakdown
        - gov_pay_metadata
        - stripe_metadata
        - stripe_payment_id
        - stripe_status
        - team_slug
        - created_at
        - flow_id
        - session_id
        - payment_id
        - status
        - amount
      filter: {}
