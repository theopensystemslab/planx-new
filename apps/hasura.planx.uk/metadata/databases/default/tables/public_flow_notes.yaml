      filter:
        flow:
          team:
            members:
              _and:
                - user_id:
                    _eq: x-hasura-user-id
                - role:
                    _eq: teamEditor
    comment: ""
update_permissions:
  - role: platformAdmin
    permission:
      columns:
        - node_id
        - placement
        - text
        - color
      set:
        updated_by: x-hasura-user-id
      filter: {}
      check: {}
    comment: ""
  - role: teamEditor
    permission:
      columns:
        - node_id
        - placement
        - text
        - color
      set:
        updated_by: x-hasura-user-id
      filter:
        flow:
          team:
            members:
              _and:
                - user_id:
                    _eq: x-hasura-user-id
                - role:
                    _eq: teamEditor
      check:
        flow:
          team:
            members:
              _and:
                - user_id:
                    _eq: x-hasura-user-id
                - role:
                    _eq: teamEditor
    comment: ""
