        - id
        - flow_id
        - node_id
        - placement
        - text
        - color
        - created_by
        - updated_by
        - created_at
        - updated_at
      filter: {}
    comment: ""
  - role: teamEditor
    permission:
      columns:
        - id
        - flow_id
        - node_id
        - placement
        - text
        - color
        - created_by
        - updated_by
        - created_at
