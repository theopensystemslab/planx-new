table:
  name: flow_notes
  schema: public
object_relationships:
  - name: createdByUser
    using:
      manual_configuration:
        column_mapping:
          created_by: id
        insertion_order: null
        remote_table:
          name: users
          schema: public
  - name: flow
    using:
      manual_configuration:
        column_mapping:
          flow_id: id
        insertion_order: null
        remote_table:
          name: flows
          schema: public
  - name: updatedByUser
    using:
      manual_configuration:
        column_mapping:
          updated_by: id
        insertion_order: null
        remote_table:
          name: users
          schema: public
insert_permissions:
  - role: platformAdmin
    permission:
      check: {}
      set:
        created_by: x-hasura-user-id
        updated_by: x-hasura-user-id
      columns:
        - flow_id
        - node_id
        - placement
        - text
        - color
    comment: ""
  - role: teamEditor
    permission:
      check:
        flow:
          team:
            members:
              _and:
                - user_id:
                    _eq: x-hasura-user-id
                - role:
                    _eq: teamEditor
      set:
        created_by: x-hasura-user-id
        updated_by: x-hasura-user-id
      columns:
        - flow_id
        - node_id
        - placement
        - text
        - color
    comment: ""
select_permissions:
  - role: platformAdmin
    permission:
