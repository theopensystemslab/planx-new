table:
  name: team_integrations
  schema: public
object_relationships:
  - name: team
    using:
      foreign_key_constraint_on: team_id
insert_permissions:
  - role: platformAdmin
    permission:
      check: {}
      columns:
        - id
        - power_automate_webhook_url
        - production_bops_secret
        - production_bops_submission_url
        - production_file_api_key
        - production_govpay_secret
        - production_power_automate_api_key
        - production_stripe_account_id
        - staging_bops_secret
        - staging_bops_submission_url
        - staging_file_api_key
        - staging_govpay_secret
        - staging_power_automate_api_key
        - staging_stripe_account_id
        - team_id
    comment: ""
select_permissions:
  - role: analyst
    permission:
      columns:
        - id
        - team_id
      filter: {}
    comment: ""
  - role: api
    permission:
      columns:
        - id
        - power_automate_webhook_url
        - production_bops_secret
        - production_bops_submission_url
        - production_file_api_key
        - production_govpay_secret
        - production_power_automate_api_key
        - production_stripe_account_id
        - staging_bops_secret
        - staging_bops_submission_url
        - staging_file_api_key
        - staging_govpay_secret
        - staging_power_automate_api_key
        - staging_stripe_account_id
        - team_id
      filter: {}
  - role: platformAdmin
    permission:
      columns:
        - id
        - team_id
      filter: {}
    comment: ""
  - role: public
    permission:
      columns:
        - id
        - team_id
      filter: {}
    comment: ""
  - role: teamEditor
    permission:
      columns:
        - id
        - team_id
      filter: {}
    comment: ""
update_permissions:
  - role: api
    permission:
      columns:
        - production_stripe_account_id
        - staging_stripe_account_id
      filter: {}
      check: null
    comment: "Team membership is enforced in the API layer (requireTeamMembership) before this role writes a connected Stripe account id"
  - role: platformAdmin
    permission:
      columns:
        - id
        - team_id
      filter: {}
      check: null
    comment: ""
